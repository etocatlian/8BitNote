<style>
  :root { --menu: #222222; --frame: #f4f4f4; --doc: #ffffff; }
  body { margin: 0; font-family: sans-serif; background: var(--frame); min-height: 100vh; transition: background .3s; }
  .toolbar { display: flex; gap: 10px; padding: 10px; background: var(--menu); align-items: center; flex-wrap: wrap; transition: background .3s; }
  .toolbar select, .toolbar input, .toolbar button { padding: 6px; font-size: 14px; border-radius: 4px; border: 1px solid #999; height: 32px; box-sizing: border-box; }
  .toolbar select { -webkit-appearance: none; -moz-appearance: none; appearance: none; padding: 6px 10px; cursor: pointer; background: #fff; }
  .toolbar input[type=color] { width: 40px; padding: 2px; cursor: pointer; }
  .toolbar button { cursor: pointer; background: #fff; min-width: 32px; display: inline-flex; align-items: center; justify-content: center; }
  .group { display: flex; gap: 4px; }
  #stripe { height: 4px; display: none; }
  #name { width: 160px; }
  #editor { min-height: 75vh; margin: 15px; padding: 20px; background: var(--doc); border: 1px solid rgba(0,0,0,.2); outline: none; font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #000; transition: background .3s; }
  .bordered { border: 2px solid currentColor; border-radius: 4px; padding: 1px 6px; }
  div.bordered { padding: 8px 10px; margin: 4px 0; }
  /* ================= VINTAGE MENU BARS ================= */
  .toolbar button, .toolbar select, .toolbar input { color: #000; }

  /* ---- Atari ST (GEM): white bar, thin black outlines, square corners, black-on-white,
          a pressed control turns black with white text ---- */
  body[data-retro=atari] .toolbar { gap: 8px; }
  body[data-retro=atari] .toolbar button,
  body[data-retro=atari] .toolbar select,
  body[data-retro=atari] .toolbar input {
    font-family: 'NB Atari ST', monospace; font-size: 16px; line-height: 1; padding: 2px 8px;
    background: #fff; color: #000; border: 1px solid #000; border-radius: 0; box-shadow: none;
  }
  body[data-retro=atari] #save { border-width: 3px; }  /* GEM's thick-bordered default button */
  body[data-retro=atari] .toolbar button:not(#save):hover,
  body[data-retro=atari] .toolbar select:hover { background: #000; color: #fff; }
  body[data-retro=atari] .toolbar button:not(#save):active { background: #000; color: #fff; }
  body[data-retro=atari] #stripe { height: 1px; }

  /* ---- Amiga (Workbench 1.3): blue gadgets with a white/black bevel, white text,
          orange when pressed ---- */
  body[data-retro=amiga] .toolbar button,
  body[data-retro=amiga] .toolbar select,
  body[data-retro=amiga] .toolbar input {
    font-family: 'NB Topaz', monospace; font-size: 16px; line-height: 1; padding: 2px 8px;
    background: #0055aa; color: #fff; border-radius: 0;
    border: 2px solid; border-color: #fff #000 #000 #fff;
  }
  body[data-retro=amiga] .toolbar input[type=text] { background: #fff; color: #000; border-color: #000 #fff #fff #000; }
  body[data-retro=amiga] .toolbar button:not(#save):hover,
  body[data-retro=amiga] .toolbar select:hover { background: #1a6cc4; }
  body[data-retro=amiga] .toolbar button:not(#save):active { background: #ff8800; color: #000; border-color: #000 #fff #fff #000; }
  body[data-retro=amiga] #stripe { height: 3px; }

  /* ---- Commodore 64: chunky 8-bit capitals, light blue on dark blue,
          reverse video when hovered ---- */
  body[data-retro=c64] .toolbar button,
  body[data-retro=c64] .toolbar select,
  body[data-retro=c64] .toolbar input {
    font-family: 'Press Start 2P', monospace; font-size: 10px; text-transform: uppercase;
    background: #352879; color: #a59bf0; border: 3px solid #a59bf0; border-radius: 0;
  }
  body[data-retro=c64] .toolbar button:not(#save):hover,
  body[data-retro=c64] .toolbar select:hover { background: #a59bf0; color: #352879; }
  body[data-retro=c64] .toolbar button:not(#save):active { background: #fff; color: #352879; }
  body[data-retro=c64] .toolbar input[type=text] { caret-color: #a59bf0; }

  /* ---- ZX Spectrum: black keys with white lettering, each control edged in
          one of the rainbow-stripe colors, filled with it on hover ---- */
  body[data-retro=spectrum] .toolbar button,
  body[data-retro=spectrum] .toolbar select,
  body[data-retro=spectrum] .toolbar input {
    font-family: 'Silkscreen', monospace; font-size: 13px; text-transform: uppercase;
    background: #000; color: #d7d7d7; border: 2px solid var(--key, #d70000); border-radius: 3px;
  }
  body[data-retro=spectrum] .toolbar button:not(#save):hover,
  body[data-retro=spectrum] .toolbar select:hover { background: var(--key, #d70000); color: #000; }
  body[data-retro=spectrum] .toolbar button:not(#save):active { background: #fff; color: #000; }
  body[data-retro=spectrum] .k1 { --key: #d70000; }
  body[data-retro=spectrum] .k2 { --key: #d7d700; }
  body[data-retro=spectrum] .k3 { --key: #00d700; }
  body[data-retro=spectrum] .k4 { --key: #00d7d7; }

  /* ---- ZX81: plain capitals in inverse video (white boxes on the black case),
          flipping to black on hover ---- */
  body[data-retro=zx81] .toolbar button,
  body[data-retro=zx81] .toolbar select,
  body[data-retro=zx81] .toolbar input {
    font-family: 'Press Start 2P', monospace; font-size: 10px; text-transform: uppercase;
    background: #fff; color: #000; border: 2px solid #fff; border-radius: 0;
  }
  body[data-retro=zx81] .toolbar button:not(#save):hover,
  body[data-retro=zx81] .toolbar select:hover { background: #000; color: #fff; }
  body[data-retro=zx81] .toolbar button:not(#save):active { background: #d70000; color: #fff; border-color: #d70000; }

  /* Dropdown lists follow the control colors */
  body[data-retro] .toolbar select option { background: inherit; color: inherit; }
  /* ================= FONT PICKER ================= */
  .picker { position: relative; }
  #fontBtn { width: 190px; justify-content: flex-start; text-align: left; white-space: nowrap; overflow: hidden; }
  #fontList { position: absolute; top: 0; left: 0; margin: 0; padding: 4px 0; list-style: none;
    background: #fff; color: #000; border: 1px solid #999; border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.25);
    z-index: 10; min-width: 230px; max-height: 60vh; overflow: auto; }
  #fontList li { padding: 6px 12px; cursor: pointer; font-size: 16px; white-space: nowrap; }
  #fontList li:hover, #fontList li:focus { background: #e6efff; outline: none; }
  #fontList li[aria-selected=true] { font-weight: bold; }

  /* ================= SIZE ARROWS (same height as the size field, no gap) ================= */
  .size-wrap { display: flex; align-items: stretch; height: 32px; }
  .size-wrap #sizeBtn { border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; }
  .stepper { display: flex; flex-direction: column; height: 32px; }
  .toolbar .stepper button { height: 16px !important; width: 20px; min-width: 0 !important; padding: 0 !important;
    margin: 0; font-size: 0 !important; line-height: 0 !important; border-radius: 0 !important; box-sizing: border-box; }
  .toolbar .stepper button:active { transform: none !important; }
  /* Outer corners of the arrows match the corner rounding of the size field in every theme */
  body { --r: 4px; }
  body[data-retro=atari], body[data-retro=amiga], body[data-retro=c64], body[data-retro=zx81] { --r: 0px; }
  body[data-retro=spectrum], body[data-retro=a2600] { --r: 3px; }
  body[data-retro=coleco] { --r: 8px; }
  body[data-retro=intv] { --r: 2px; }
  .toolbar .stepper #sizeUp { border-radius: 0 var(--r) 0 0 !important; }
  .toolbar .stepper #sizeDown { border-radius: 0 0 var(--r) 0 !important; }

  /* ================= SAVE ICON ================= */
  .toolbar #save { padding: 2px 8px; min-width: 40px; line-height: 0; }
  #save svg { display: block; }
  body[data-retro] .toolbar #save:hover { filter: brightness(1.25); }
  body[data-retro] .toolbar #save:active { filter: brightness(.8); }

  /* ================= GAME CONSOLE MENU BARS ================= */
  /* ---- Atari 2600: ribbed black plastic bar, brushed-silver switches ---- */
  body[data-retro=a2600] .toolbar button,
  body[data-retro=a2600] .toolbar select,
  body[data-retro=a2600] .toolbar input {
    font-family: 'Silkscreen', monospace; font-size: 12px; text-transform: uppercase; color: #111;

  /* Windows 3.1: thick sizing border with corner marks, navy title bar, control-menu box,

      linear-gradient(#000,#000) left 22px bottom 0 / 1px 3px no-repeat, linear-gradient(#000,#000) right 22px bottom 0 / 1px 3px no-repeat,
      linear-gradient(#000,#000) left 0 top 22px / 3px 1px no-repeat, linear-gradient(#000,#000) right 0 top 22px / 3px 1px no-repeat,

  /* ================= v39: the start-up screen shown over the page until it is clicked ================= */
  #welcome { position: absolute; z-index: 3; box-sizing: border-box; overflow: hidden; cursor: text; outline: none; }

  #rulerDD .dd-list li, #rulerDD .dd-list li { display: flex; align-items: center; gap: 10px; }

  /* ================= v39: Text and Highlight show pictures with the chosen colour under them ================= */

  /* ================= v39: "Aa" drawn as large as fits, at least 4px from every edge ================= */

  /* ================= v39: every list opens lined up with the left edge of its button ================= */

  /* ================= v41: one lettering and size for the whole menu bar and every list, per theme ================= */
  .dd-list li, #fontList li { font-size: var(--ms, 14px) !important; text-transform: var(--mt, none); letter-spacing: var(--ml, normal);
    font-weight: var(--mw, normal) !important; line-height: 1.4; }
  .dd-list li, .dd-list li span, .dd-list li input, .dd-list li button, #colorPop, #colorPop button, #colorPop input, #fontList li .tag {
    font-family: var(--mf, sans-serif) !important; font-size: var(--ms, 14px) !important; }
  #saveDD #saveLoc, #nameDD #openLoc { height: auto; min-height: 26px; padding-top: 2px; padding-bottom: 2px; }
  #saveDD #saveLocBtn, #nameDD #openLocBtn { height: auto; min-height: 26px; padding-top: 2px; padding-bottom: 2px; }
  #fontList li .tag { opacity: .55; }
  /* the file name, font and theme fields share one width: enough for the longest theme name */

    box-sizing: border-box; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  /* ================= v41: links in the note ================= */
  #editor a { color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  /* ================= v47: the Atari ST keyboard under the note ================= */
  #kbd { position: relative; margin: 0 28px 12px; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }

  html:has(body.kbd-on), body.kbd-on { height: 100%; overflow: hidden; }

  /* ================= v50: printing / saving as PDF: just the note, in its colours ================= */

    .topbar, #stripe, #ruler, #winTitle, #winV, #winH, #welcome, #kbd, #machineCard, #toast, #colorPop, .dd-list, #fontList { display: none !important; }
    #win, #winClient, #winMain, #winDoc, #edwrap { display: block !important; margin: 0 !important; padding: 0 !important; border: none !important;
      box-shadow: none !important; background: none !important; }

      height: auto !important; overflow: visible !important; padding: 15mm !important; }

  /* ================= v51: the current choice in every list is highlighted ================= */

  #nameDD .dd-list li.name-row { display: flex; align-items: center; gap: 8px; cursor: default; padding: 6px 10px 8px; }
  #nameDD .dd-list li.name-row:hover { background: none; }
  #nameDD .dd-list #name { flex: 1; min-width: 160px; width: auto !important; height: 28px; }
  /* the Theme button is just as wide as its word */

  /* ================= v53: Box and Theme are pictures; Open / Delete beside each recent note ================= */
  .toolbar #themeBtn { padding: 2px 8px !important; min-width: 40px !important; line-height: 0; }
  .toolbar #border { line-height: 0; }
  /* Windows themes draw the theme field as a drop-down box: leave room for its arrow */

  #themeBtn svg, #border svg { display: block; }

    color: #222; cursor: pointer; font-family: var(--mf, sans-serif) !important; font-size: calc(var(--ms, 14px) * .9) !important; line-height: 1.5; }

  #nameDD .dd-list li.recent .rbtn.del.armed { background: #d93025; border-color: #d93025; color: #fff; }

  /* ================= v54: each machine's menu bar uses that machine's own font (the one its note uses),

  body[data-retro=cpc] .toolbar button, body[data-retro=cpc] .toolbar select, body[data-retro=cpc] .toolbar input { font-family: 'NB Amstrad', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=bbc] .toolbar button, body[data-retro=bbc] .toolbar select, body[data-retro=bbc] .toolbar input { font-family: 'NB BBC', monospace; font-size: 22px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=x07] .toolbar button, body[data-retro=x07] .toolbar select, body[data-retro=x07] .toolbar input { font-family: 'NB X07', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=c64] .toolbar button, body[data-retro=c64] .toolbar select, body[data-retro=c64] .toolbar input { font-family: 'NB C64', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=pet] .toolbar button, body[data-retro=pet] .toolbar select, body[data-retro=pet] .toolbar input { font-family: 'NB PET', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=alice] .toolbar button, body[data-retro=alice] .toolbar select, body[data-retro=alice] .toolbar input { font-family: 'NB Alice', monospace; font-size: 24px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=minitel] .toolbar button, body[data-retro=minitel] .toolbar select, body[data-retro=minitel] .toolbar input { font-family: 'NB Minitel', monospace; font-size: 20px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=coco] .toolbar button, body[data-retro=coco] .toolbar select, body[data-retro=coco] .toolbar input { font-family: 'NB CoCo', monospace; font-size: 24px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=to7] .toolbar button, body[data-retro=to7] .toolbar select, body[data-retro=to7] .toolbar input { font-family: 'NB TO7', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=m100] .toolbar button, body[data-retro=m100] .toolbar select, body[data-retro=m100] .toolbar input { font-family: 'NB M100', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=spectrum] .toolbar button, body[data-retro=spectrum] .toolbar select, body[data-retro=spectrum] .toolbar input { font-family: 'NB Spectrum', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=zx81] .toolbar button, body[data-retro=zx81] .toolbar select, body[data-retro=zx81] .toolbar input { font-family: 'NB ZX81', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=a2600] .toolbar button, body[data-retro=a2600] .toolbar select, body[data-retro=a2600] .toolbar input { font-family: 'NB Atari 2600', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=coleco] .toolbar button, body[data-retro=coleco] .toolbar select, body[data-retro=coleco] .toolbar input { font-family: 'NB Coleco', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }
  body[data-retro=intv] .toolbar button, body[data-retro=intv] .toolbar select, body[data-retro=intv] .toolbar input { font-family: 'NB Aquarius', monospace; font-size: 16px; line-height: 1; letter-spacing: 0; font-weight: normal; }

  /* ================= v54: the note's name in the Save menu ================= */
  .dd-list li.name-row { display: flex; align-items: center; gap: 8px; cursor: default; padding: 6px 10px 8px; }
  .dd-list li.name-row:hover { background: none; }
  .dd-list #name { flex: 1; min-width: 180px; width: auto !important; height: 28px; }
  #saveDD .dd-list li.save-head, #nameDD .dd-list li.recent-head { cursor: default; opacity: .6; padding-bottom: 2px; }
  #saveDD .dd-list li.save-head:hover { background: none; }

  /* ================= v54: the note's name at the top of the page ================= */
  #noteTitle { position: absolute; z-index: 2; box-sizing: border-box; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none;
    padding: 0 20px; display: flex; align-items: center; }
  #noteTitle[hidden] { display: none; }

  #noteTitle.plain { height: 30px; justify-content: center; font: 600 13px -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: .02em;
    border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); background: color-mix(in srgb, currentColor 5%, transparent); }
  /* vintage machines: a status line in reverse video, in the machine's own lettering */
  #noteTitle.status { height: 22px; justify-content: flex-start; padding: 0 12px; }

  body.titled.ruler-on #editor { margin-top: 15px !important; padding-top: calc(var(--tth, 30px) + var(--rh, 0px) + 14px) !important; }
  body.titled.ruler-on[data-wide] #editor { margin-top: 28px !important; }

  /* ================= v57: Vintage looks ================= */
  #crt { position: relative; }
  #scan { display: none; position: absolute; inset: 0; z-index: 6; pointer-events: none; border-radius: inherit;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
  body.scan #scan { display: block; }
  body.scan #editor, body.scan #welcome, body.scan #noteTitle { text-shadow: 0 0 2px color-mix(in srgb, currentColor 55%, transparent); }
  /* CRT monitor: a plastic bezel, a slightly curved dark-cornered screen */

    box-shadow: 0 8px 20px rgba(0,0,0,.45), inset 0 0 0 2px rgba(0,0,0,.35); }
  body.crt #crt::after { content: ''; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; z-index: 7;

  body.crt.screenborder:not([data-gui]) #editor { border-radius: 10px !important; }
  /* keyboard: the maker badge can be hidden */
  #kbd .badge-cover { position: absolute; pointer-events: none; }
  #kbd .badge-cover[hidden] { display: none; }
  /* the Vintage menu */
  #vintageMenu { position: fixed; z-index: 35; background: #fff; color: #111; border: 1px solid #999; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.3);
    padding: 8px 12px 10px; max-height: 80vh; overflow: auto; min-width: 250px; font-family: var(--mf, sans-serif); font-size: var(--ms, 14px);
    text-transform: var(--mt, none); letter-spacing: var(--ml, normal); }

  #vintageMenu { display: grid; grid-template-columns: max-content max-content; column-gap: 16px; }
  #vintageMenu[hidden] { display: none; }
  #vintageMenu .vm-head { grid-column: 1 / -1; }
  #vintageMenu .vm-row { display: contents; }
  #vintageMenu .vm-l { opacity: .75; padding: 6px 0; white-space: nowrap; align-self: center; }
  #vintageMenu .vm-o { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 0; align-items: center; }
  #vintageMenu label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  #vintageMenu input { margin: 0; accent-color: #3b82f6; width: 15px; height: 15px; }
  #machineArt[aria-expanded=true] { outline: 2px solid #3b82f6; outline-offset: 2px; }
  #machineCard .mc-legal { margin-top: 10px; font-size: 11px; opacity: .6; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ================= v57: notes in this browser, auto-save, find bar, word count ================= */
  #nameDD .dd-list li.recent .rbtn[disabled] { opacity: .4; cursor: default; }
  #nameDD .dd-list li.recent.stored .where { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #saveDD .dd-list li.save-auto { cursor: default; padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; }
  #saveDD .dd-list li.save-auto:hover { background: none; }
  #saveDD .dd-list li.save-auto label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  #saveDD .dd-list li.save-auto .hint { opacity: .55; padding-left: 24px; }
  #findBar { position: fixed; z-index: 34; top: calc(var(--tb, 56px) + 6px); right: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    background: #fff; color: #111; border: 1px solid #999; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.3); padding: 8px;
    font: 14px -apple-system, 'Helvetica Neue', Arial, sans-serif; max-width: calc(100vw - 32px); box-sizing: border-box; }
  #findBar[hidden] { display: none; }
  #findBar input { height: 28px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 4px; padding: 0 8px; width: 170px; font: inherit; }
  #findBar button { height: 28px; min-width: 28px; border: 1px solid #999; border-radius: 4px; background: #fff; cursor: pointer; font: inherit; padding: 0 8px; }
  #findBar button:hover { background: #e6efff; }
  ::highlight(findall) { background-color: rgba(255, 200, 0, .4); }
  ::highlight(findcur) { background-color: #ff9632; color: #000; }
  #findCount { min-width: 70px; opacity: .65; font-size: 12px; }
  #noteTitle .nt-count { opacity: .6; font-size: .8em; white-space: nowrap; }
  #noteTitle.plain .nt-count { position: absolute; right: 16px; }
  #noteTitle.status .nt-count { margin-left: auto; padding-left: 16px; font-size: 1em; }
  #noteTitle .nt-name { overflow: hidden; text-overflow: ellipsis; }

  /* ================= v57: phones and small windows ================= */
  @media (max-width: 760px) {
    .toolbar { gap: 6px !important; padding: 6px !important; }
    .toolbar button, .toolbar select, .toolbar input { min-width: 30px; }
    .group { gap: 2px; }
    #editor { margin: 8px !important; padding: 14px !important; min-height: 60vh; }
    body[data-wide] #editor { margin: 10px !important; }
    body.titled #editor { padding-top: calc(var(--tth, 30px) + 10px) !important; }
    body[data-gui] #win { margin: 8px !important; }
    body.crt #crt { margin: 8px; border-width: 12px; border-radius: 18px; padding: 8px; }
    #kbd { margin: 0 8px 8px !important; }
    #ruler { margin: 8px 8px 0 !important; }
    #vintageMenu { left: 8px !important; right: 8px; min-width: 0; }
    #vintageMenu { grid-template-columns: 1fr; }
    #vintageMenu .vm-l { padding-bottom: 0; }
    #findBar { left: 8px; right: 8px; top: auto; bottom: 8px; }
    #findBar input { flex: 1; min-width: 120px; }
    #noteTitle .nt-count { display: none; }
    body.screenborder #editor { border-width: 12px !important; }
    .dd-list, #fontList { max-width: calc(100vw - 16px); }
  }
  @media print { #crt { all: unset !important; display: block !important; } #scan, #vintageMenu, #findBar, #srLive { display: none !important; } }
</style>

<script>

  const BASE_THEMES = {
    'Default':        { menu: '#222222', frame: '#f4f4f4', doc: '#ffffff', text: '#000000' },
    'Deep Navy':      { menu: '#0d1b2a', frame: '#778da9', doc: '#e0e1dd', text: '#000000' },

    'ZX81':           { group: 'computer', retro: 'zx81', native: 'NB ZX81', menu: '#000000', frame: '#ffffff', doc: '#ffffff', text: '#000000', stripe: '#d70000' },
    // Atari 2600: woodgrain panels around black ribbed plastic, silver switches

  // Draws the key or controller as crisp pixel art; the outline colour
  // is chosen so it stands out against the toolbar
  function machineSVG(id, toolbarColor) {
    const m = MACHINES[id];
    if (!m) return '';
    const hex = (toolbarColor.match(/#[0-9a-f]{6}/i) || ['#ffffff'])[0];
    const n = parseInt(hex.slice(1), 16);
    const dark = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) < 110;
    const outline = dark ? '#9a9a9a' : '#222222';
    // trim empty rows and columns so the drawing itself fills the full height
    let rows = m.rows.filter(r => /[^.]/.test(r));
    const used = [...rows[0]].map((_, x) => rows.some(r => r[x] !== '.'));
    const x0 = used.indexOf(true), x1 = used.lastIndexOf(true);
    rows = rows.map(r => r.slice(x0, x1 + 1));
    const w = rows[0].length, h = rows.length;
    let rects = '';
    rows.forEach((row, y) => {
      let x = 0;
      while (x < w) {
        const ch = row[x];
        let x2 = x + 1;
        while (x2 < w && row[x2] === ch) x2++;
        if (ch !== '.') rects += '<rect x="' + x + '" y="' + y + '" width="' + (x2 - x) + '" height="1" fill="' + (ch === 'o' ? outline : m.pal[ch]) + '"/>';
        x = x2;
      }
    });
    // flat keys as tall as the toolbar buttons (32px); tall keys and controllers use the bar's padding too (44px)
    const H = h > 40 ? 44 : 32, W = Math.round(w * H / h);
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges">' + rects + '</svg>';
  }

  let driveMode = null, driveToken = null, driveTokenTime = 0;
  const GOOGLE_CLIENT_ID_KEY = 'notepad-google-client-id';
  function loadGoogle() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    return new Promise((res, rej) => {
      const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
      sc.onload = () => res(); sc.onerror = () => rej(new Error('Google sign-in could not be loaded'));

        client_id: clientId, scope: 'https://www.googleapis.com/auth/drive.file',
        callback: r => { if (r && r.access_token) { driveToken = r.access_token; driveTokenTime = Date.now(); res(driveToken); } else rej(new Error((r && r.error) || 'not allowed')); },
        error_callback: e => rej(new Error((e && e.type) || 'cancelled'))

  async function uploadToDrive(fileName, blob, clientId) {
    const token = await driveAccessToken(clientId);
    const meta = { name: fileName.replace(/\.docx$/i, ''), mimeType: 'application/vnd.google-apps.document' };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
    form.append('file', blob);
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',
      { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: form });

    if (!r.ok) throw new Error('Google Drive said ' + r.status);

    try { clientId = localStorage.getItem(GOOGLE_CLIENT_ID_KEY) || ''; } catch (e) {}
    if (!clientId) {
      clientId = (window.prompt('Paste the Google OAuth client ID for this website (needed once):') || '').trim();
      if (!clientId) return;
      try { localStorage.setItem(GOOGLE_CLIENT_ID_KEY, clientId); } catch (e) {}
    }
    let result = null, failed = null;
    driveMode = async (fileName, blob) => { try { result = await uploadToDrive(fileName, blob, clientId); } catch (e) { failed = e; } };
    try { await saveDocx(); } finally { driveMode = null; }
    if (failed) { toast('Couldn’t save to Google Drive: ' + failed.message); return; }
    if (result) { noteDirty = false; toast('Saved “' + result.name + '” to Google Drive as a Google Doc.'); }
  }

  // =================== v53: delete a recent note ===================
  // First click arms the button ("Sure?"), a second click within 3 seconds deletes.
  // A file saved in a chosen folder is deleted from that folder; a downloaded copy can only be taken off the list.
  async function deleteRecent(r, btn) {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = 'Sure?';
      btn.setAttribute('aria-label', 'Press again to delete ' + r.name);
      clearTimeout(btn._t); btn._t = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = 'Delete'; }, 3000);
      return;
    }
    let deleted = false;
    if (r.handle) {
      try {
        if (r.handle.remove) {
          let p = await r.handle.queryPermission({ mode: 'readwrite' });
          if (p !== 'granted') p = await r.handle.requestPermission({ mode: 'readwrite' });
          if (p === 'granted') { await r.handle.remove(); deleted = true; }
        } else if (saveDir && saveDir.name === r.where) { await saveDir.removeEntry(r.name); deleted = true; }
      } catch (e) { /* already gone, or not allowed */ }
    }
    recentFiles = recentFiles.filter(x => x !== r);
    kv('readwrite', st => st.put(recentFiles, 'recent')).catch(() => {
      kv('readwrite', st => st.put(recentFiles.map(x => Object.assign({}, x, { handle: null })), 'recent')).catch(() => {});
    });
    drawNameList();
    const first = nameList.querySelector('.rbtn, li[role=menuitem]'); if (first) first.focus();
    toast(deleted ? 'Deleted “' + r.name + '” from ' + r.where + '.'
                  : 'Took “' + r.name + '” off the list. The file itself is still in ' + r.where + ' (the browser can’t delete it there).');
  }

  // =================== v54: the note's name at the top of the page ===================
  // Windowed machines already show it in the window's title bar. Everywhere else it sits at the top of the page:
  // a quiet heading in modern themes, a reverse-video status line in the machine's own lettering on vintage ones.
  const noteTitle = document.getElementById('noteTitle');
  function placeNoteTitle() {
    const gui = document.body.dataset.gui, retro = document.body.dataset.retro;
    const rl = document.getElementById('ruler');
    if (gui) {
      noteTitle.hidden = true; document.body.classList.remove('titled');
      rl.classList.remove('in-page'); rl.style.left = rl.style.top = rl.style.width = '';
      return;
    }
    noteTitle.hidden = false; document.body.classList.add('titled');
    noteTitle.className = retro ? 'status' : 'plain';
    const t = themes[theme.value] || {};
    noteTitle.innerHTML = '<span class="nt-name"></span><span class="nt-count"></span>';
    noteTitle.querySelector('.nt-name').textContent = nameField.value || 'Untitled';
    noteTitle.querySelector('.nt-count').textContent = typeof noteCounts === 'function' ? noteCounts() : '';
    if (retro) {
      noteTitle.style.fontFamily = "'" + (t.native || 'monospace') + "', monospace";
      noteTitle.style.fontSize = getComputedStyle(document.getElementById('sizeBtn')).fontSize;
      noteTitle.style.background = getComputedStyle(editor).color;       // reverse video: text colour behind,
      noteTitle.style.color = /gradient/.test(t.doc || '') ? '#000' : (t.doc || '#000');   // page colour for the letters
      noteTitle.style.height = Math.round(parseFloat(noteTitle.style.fontSize) * 1.5) + 'px';
    } else {
      noteTitle.style.fontFamily = noteTitle.style.fontSize = noteTitle.style.background = noteTitle.style.height = '';
      noteTitle.style.color = getComputedStyle(editor).color;
    }
    document.body.style.setProperty('--tth', noteTitle.offsetHeight + 'px');
    noteTitle.style.left = (editor.offsetLeft + editor.clientLeft) + 'px';
    noteTitle.style.top = (editor.offsetTop + editor.clientTop) + 'px';
    noteTitle.style.width = editor.clientWidth + 'px';
    // the ruler, when shown, goes right under the name line, across the page
    if (!rl.hidden) {
      rl.classList.add('in-page');
      rl.style.left = editor.offsetLeft + 'px';
      rl.style.top = (editor.offsetTop + editor.clientTop + noteTitle.offsetHeight) + 'px';
      rl.style.width = editor.offsetWidth + 'px';
      document.body.style.setProperty('--rh', rl.offsetHeight + 'px');
      drawRuler();
    } else { rl.classList.remove('in-page'); document.body.style.setProperty('--rh', '0px'); }
  }
  new MutationObserver(() => requestAnimationFrame(placeNoteTitle)).observe(document.getElementById('ruler'), { attributes: true, attributeFilter: ['hidden'] });
  nameField.addEventListener('input', placeNoteTitle);
  window.addEventListener('resize', () => requestAnimationFrame(placeNoteTitle));
  new MutationObserver(() => requestAnimationFrame(placeNoteTitle)).observe(document.body, { attributes: true, attributeFilter: ['data-retro', 'data-gui', 'class'] });
  new MutationObserver(() => requestAnimationFrame(placeNoteTitle)).observe(editor, { attributes: true, attributeFilter: ['style'] });
  if (window.ResizeObserver) new ResizeObserver(() => placeNoteTitle()).observe(editor);
  theme.addEventListener('change', () => requestAnimationFrame(placeNoteTitle));
  if (document.fonts) document.fonts.ready.then(placeNoteTitle);
  placeNoteTitle();

    kbdKeys.innerHTML = KEYS.map((k, i) => '<span class="kk" data-i="' + i + '" data-id="' + k.id + '" style="left:' + k.r[0] + '%;top:' + k.r[1] +

  // the note fills the space between the menu bar and the keyboard; only the note scrolls
  function layoutKbd() {

    const kh = kbd.getBoundingClientRect().height;
    const h = innerHeight - topH - top - chrome - 12 - kh - 12;

  function showMods() {

  document.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey; if (!mod) return;
    if (e.altKey && e.code === 'KeyN') { e.preventDefault(); newNote(); return; }
    if (e.altKey || e.shiftKey) return;
    if (e.code === 'KeyS') { e.preventDefault(); ({ txt: saveText, html: saveHTML, docx: saveDocx }[lastFormat] || saveHTML)(); }
    else if (e.code === 'KeyO') { e.preventDefault(); chooseOpenFile(); }
    else if (e.code === 'KeyF') { e.preventDefault(); openFind(); }
  });

  // =================== v57: find and replace ===================
  const findBar = document.createElement('div');
  findBar.id = 'findBar'; findBar.hidden = true; findBar.setAttribute('role', 'search'); findBar.setAttribute('aria-label', 'Find and replace');
  findBar.innerHTML = '<input type="text" id="findIn" placeholder="Find" aria-label="Find"><span id="findCount" aria-live="polite"></span>' +
    '<button type="button" id="findPrev" title="Previous match" aria-label="Previous match">↑</button><button type="button" id="findNext" title="Next match" aria-label="Next match">↓</button>' +
    '<input type="text" id="replIn" placeholder="Replace with" aria-label="Replace with">' +
    '<button type="button" id="replOne">Replace</button><button type="button" id="replAll">Replace all</button>' +
    '<button type="button" id="findClose" title="Close" aria-label="Close find">×</button>';
  document.body.appendChild(findBar);
  const findIn = findBar.querySelector('#findIn'), replIn = findBar.querySelector('#replIn'), findCount = findBar.querySelector('#findCount');
  let matches = [], matchIx = -1;
  function findMatches(q) {
    const res = []; if (!q) return res;
    const nodes = [], w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT); let n, text = '';
    while ((n = w.nextNode())) { nodes.push([n, text.length]); text += n.data; }
    const hay = text.toLowerCase(), needle = q.toLowerCase();
    const at = pos => { for (let i = nodes.length - 1; i >= 0; i--) if (nodes[i][1] <= pos) return [nodes[i][0], pos - nodes[i][1]]; return null; };
    for (let i = hay.indexOf(needle); i >= 0; i = hay.indexOf(needle, i + Math.max(1, needle.length))) {
      const a = at(i), b = at(i + needle.length - 1); if (!a || !b) continue;
      const r = document.createRange(); r.setStart(a[0], a[1]); r.setEnd(b[0], b[1] + 1); res.push(r);
    }
    return res;
  }
  function showMatch(i) {
    if (!matches.length) { clearFindMarks(); findCount.textContent = findIn.value ? 'No matches' : ''; return; }
    matchIx = (i + matches.length) % matches.length;
    const r = matches[matchIx];
    // matches are painted, not selected, so typing in the find box keeps working
    if (window.CSS && CSS.highlights && window.Highlight) {
      CSS.highlights.set('findall', new Highlight(...matches)); CSS.highlights.set('findcur', new Highlight(r));
    } else { const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    savedRange = r.cloneRange();
    const rect = r.getBoundingClientRect();
    if (document.body.classList.contains('kbd-on')) {
      const er = editor.getBoundingClientRect();
      if (rect.top < er.top + 40 || rect.bottom > er.bottom - 20) editor.scrollTop += rect.top - er.top - editor.clientHeight / 3;
    } else if (rect.top < 90 || rect.bottom > innerHeight - 40) scrollBy(0, rect.top - innerHeight / 3);
    findCount.textContent = (matchIx + 1) + ' of ' + matches.length;
  }
  function refreshFind(keepPos) { matches = findMatches(findIn.value); showMatch(keepPos ? matchIx : 0); }
  function openFind() {
    findBar.hidden = false;
    const s = getSelection();
    if (s.rangeCount && !s.isCollapsed && editor.contains(s.anchorNode) && s.toString().length < 80) findIn.value = s.toString();
    findIn.focus(); findIn.select();
    if (findIn.value) refreshFind();
  }
  function clearFindMarks() { if (window.CSS && CSS.highlights) { CSS.highlights.delete('findall'); CSS.highlights.delete('findcur'); } }
  function closeFind() { findBar.hidden = true; matches = []; clearFindMarks(); findCount.textContent = ''; restoreSelection(); }
  function replaceCurrent() {
    if (matchIx < 0 || !matches[matchIx]) return false;
    const r = matches[matchIx]; editor.focus();
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand('insertText', false, replIn.value);
    savedRange = s.getRangeAt(0).cloneRange();
    return true;
  }
  findIn.addEventListener('input', () => refreshFind());
  findIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); showMatch(matchIx + (e.shiftKey ? -1 : 1)); } });
  findBar.querySelector('#findNext').onclick = () => showMatch(matchIx + 1);
  findBar.querySelector('#findPrev').onclick = () => showMatch(matchIx - 1);
  findBar.querySelector('#replOne').onclick = () => { if (replaceCurrent()) { const ix = matchIx; matches = findMatches(findIn.value); showMatch(ix); replIn.focus(); } };
  findBar.querySelector('#replAll').onclick = () => {
    // from the last match back to the first, finding again each time (each replacement changes the text after it only)
    let n = 0; const total = findMatches(findIn.value).length;
    for (let i = total - 1; i >= 0; i--) { matches = findMatches(findIn.value); matchIx = i; if (matches[i] && replaceCurrent()) n++; }
    matches = findMatches(findIn.value); clearFindMarks(); findCount.textContent = n + ' replaced'; replIn.focus();
    toast('Replaced ' + n + (n === 1 ? ' match.' : ' matches.'));
  };
  findBar.querySelector('#findClose').onclick = closeFind;
  findBar.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeFind(); } });
  findBar.querySelectorAll('button').forEach(b => b.onmousedown = e => e.preventDefault());

  // =================== v57: word count in the name line ===================
  function noteCounts() {
    const t = (editor.innerText || '').replace(/​/g, '');
    const words = (t.match(/[^\s]+/g) || []).length;
    return words + (words === 1 ? ' word' : ' words') + ' · ' + t.replace(/\s/g, '').length + ' characters';
  }
  let countTimer = null;
  editor.addEventListener('input', () => { clearTimeout(countTimer); countTimer = setTimeout(() => { const c = document.querySelector('#noteTitle .nt-count'); if (c) c.textContent = noteCounts(); }, 300); });

  window.__vintageReady = true;
  // ---- start: apply this machine's vintage settings, register the offline helper when served from a website
  applyVintage();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
